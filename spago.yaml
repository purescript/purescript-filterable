package:
  name: filterable
  description: Classes for filterable and witherable data structures
  build:
    strict: true
    pedanticPackages: true
  publish:
    version: 5.0.1
    license: MIT
    location:
      githubOwner: purescript
      githubRepo: purescript-filterable
  dependencies:
    - arrays: ">=7.0.0 <8.0.0"
    - control: ">=6.0.0 <7.0.0"
    - either: ">=6.0.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - identity: ">=6.0.0 <7.0.0"
    - lists: ">=7.0.0 <8.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - newtype: ">=5.0.0 <6.0.0"
    - ordered-collections: ">=3.0.0 <4.0.0"
    - prelude: ">=6.0.0 <7.0.0"
    - st: ">=6.0.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
  test:
    main: Test.Main
    strict: true
    pedanticPackages: true
    dependencies:
      - assert: ">=6.0.0 <7.0.0"
      - console: ">=6.0.0 <7.0.0"
      - effect: ">=4.0.0 <5.0.0"
workspace: {}
